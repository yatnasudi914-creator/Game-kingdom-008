name: Build KingdomsLords APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KingdomsLords_Isometric_HD_Android10_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q KingdomsLords_Isometric_HD_Android10_Project.zip -d project
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KingdomsLords-HD-Android10-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
